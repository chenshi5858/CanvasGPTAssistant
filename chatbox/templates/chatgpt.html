{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASISTENTE UANDES</title>
    <link rel="stylesheet" href="{% static 'chatgpt_style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="{% static 'chatgpt_script.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- katex -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body class = "fondo">
    <input type="hidden" name="csrfmiddlewaretoken" value="{% csrf_token %}">
    <div class="chat_header">
        <h1>{{ agent_name }}</h1>
        {% if not canvas_user %}
            <button type="button" class="reset_button" id="resetConversationButton">Reset conversación</button>
        {% endif %}
    </div>
    <div class="contenedor_externo_chatbox">
        <div class="contenedor_interno_chatbox">
            <div class="mostrador_mensajes">
                {%for m in messages%}
                <div class="user">
                    {{ m.prompt_text }}
                </div>
                <div class="gpt">
                    {{ m.prompt_answer|safe }}
                </div>
            {% endfor %}
            </div>
            <div class="scroll_button" id="scrollButton">
                <i class="fas fa-arrow-down"></i>
            </div>
            <div class="contenedor_mensaje">
                <div class="caja_mensaje">
                    <div class = "texto_mensaje">
                        <textarea autofocus placeholder="Escriba su mensaje aquí" class="input_mensaje" 
                            data-user="{{ canvas_user }}"
                            data-course="{{ course }}"
                            data-login= "{{ login }}"
                            data-agent="{{ agent_id }}"
                            data-title="{{ course_title }}"></textarea>
                    </div>
                </div>
                <div class="boton_enviar">
                    <div class="boton_enviar">
                        <i class="fas fa-paper-plane"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
